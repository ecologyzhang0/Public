name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pytest
      - name: Bundle local Chinese OCR engine
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $root = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path "$root\tesseract.exe")) { throw "Tesseract installation not found at $root" }
          New-Item -ItemType Directory -Force -Path build-assets/tesseract/tessdata | Out-Null
          Copy-Item "$root\tesseract.exe" build-assets/tesseract/
          Copy-Item "$root\*.dll" build-assets/tesseract/
          Copy-Item "$root\tessdata\eng.traineddata" build-assets/tesseract/tessdata/
          Copy-Item "$root\tessdata\osd.traineddata" build-assets/tesseract/tessdata/
          Invoke-WebRequest -Uri https://github.com/tesseract-ocr/tessdata_fast/raw/main/chi_sim.traineddata -OutFile build-assets/tesseract/tessdata/chi_sim.traineddata
          $env:TESSDATA_PREFIX = "$PWD/build-assets/tesseract/tessdata"
          & "$PWD/build-assets/tesseract/tesseract.exe" --list-langs
          python -c "from PIL import Image,ImageDraw,ImageFont; im=Image.new('RGB',(900,180),'white'); ImageDraw.Draw(im).text((24,48),'OCR ENGINE CHECK',font=ImageFont.truetype(r'C:\Windows\Fonts\arial.ttf',56),fill='black'); im.save('ocr-probe.png')"
          & "$PWD/build-assets/tesseract/tesseract.exe" ocr-probe.png stdout -l eng --psm 6
      - name: Run conversion tests
        shell: pwsh
        run: |
          $env:PDF_TO_WORD_TESSERACT = "$PWD/build-assets/tesseract/tesseract.exe"
          python -m pytest
      - name: Build portable executable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-win64.zip -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath tools
          $upxDir = (Get-ChildItem tools -Directory | Select-Object -First 1).FullName
          & "$upxDir/upx.exe" --version
          pyinstaller --noconfirm --clean --onefile --windowed --upx-dir "$upxDir" --name PDFtoEditableWord --collect-all pymupdf --add-binary "build-assets/tesseract/tesseract.exe;tesseract" --add-binary "build-assets/tesseract/*.dll;tesseract" --add-data "build-assets/tesseract/tessdata;tesseract/tessdata" --paths src src/pdf_to_editable_word/app.py
          Write-Output "Executable bytes: $((Get-Item dist/PDFtoEditableWord.exe).Length)"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PDFtoEditableWord-windows
          path: dist/PDFtoEditableWord.exe
