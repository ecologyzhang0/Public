name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Bundle local Chinese OCR engine
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $tesseract = (Get-Command tesseract).Source
          $root = Split-Path $tesseract -Parent
          New-Item -ItemType Directory -Force -Path build-assets | Out-Null
          Copy-Item $root build-assets/tesseract -Recurse -Force
          Invoke-WebRequest -Uri https://github.com/tesseract-ocr/tessdata_fast/raw/main/chi_sim.traineddata -OutFile build-assets/tesseract/tessdata/chi_sim.traineddata
      - name: Build portable executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PDFtoEditableWord --collect-all pymupdf --add-binary "build-assets/tesseract/tesseract.exe;tesseract" --add-binary "build-assets/tesseract/*.dll;tesseract" --add-data "build-assets/tesseract/tessdata;tesseract/tessdata" --paths src src/pdf_to_editable_word/app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PDFtoEditableWord-windows
          path: dist/PDFtoEditableWord.exe
