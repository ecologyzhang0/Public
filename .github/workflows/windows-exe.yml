name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pytest
      - name: Run conversion tests
        run: python -m pytest
      - name: Build portable executable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-win64.zip -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath tools
          $upxDir = (Get-ChildItem tools -Directory | Select-Object -First 1).FullName
          & "$upxDir/upx.exe" --version
          pyinstaller --noconfirm --clean --onefile --windowed --upx-dir "$upxDir" --name PDFtoEditableWord --collect-all pymupdf --collect-all rapidocr --collect-all onnxruntime --paths src src/pdf_to_editable_word/app.py
          Write-Output "Executable bytes: $((Get-Item dist/PDFtoEditableWord.exe).Length)"
      - name: Smoke test portable executable launch
        shell: pwsh
        run: |
          Start-Process -FilePath dist/PDFtoEditableWord.exe
          Start-Sleep -Seconds 8
          $running = @(Get-Process PDFtoEditableWord -ErrorAction SilentlyContinue)
          if ($running.Count -eq 0) {
            throw "The portable executable exited before its native window could start."
          }
          $running | Stop-Process -Force
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PDFtoEditableWord-windows
          path: dist/PDFtoEditableWord.exe
