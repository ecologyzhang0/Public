[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-editable-word"
version = "0.1.0"
description = "Local PDF to editable Word converter for Windows"
requires-python = ">=3.9"
dependencies = [
  "PyMuPDF>=1.24,<1.27",
  "python-docx>=1.1,<1.3",
  "Pillow>=10,<12",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
]

[project.scripts]
pdf-to-editable-word = "pdf_to_editable_word.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
